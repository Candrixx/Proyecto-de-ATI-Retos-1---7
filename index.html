<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATI[UCV]Log 2026-1</title>
    <link rel="icon" sizes="32x32" href="/icon/cropped-logonuevo-32x32.png" type="image/png">
    <link rel="icon" sizes="192x192" href="/icon/cropped-logonuevo-192x192.png" type="image/png">

    <style>
        @import url(css/_theme.css);
        body { 
            margin: 0; 
            padding: 0; 
            background-color: var(--grey-100);
        }

        header {
            width: 100%;
            background-color: var(--main-color);
            padding: 10px 0;
            border-bottom: 2px solid var(--grey-400);
        }

        footer {
            border-top: 2px solid var(--grey-400);
            width: 100%;
            text-align: center;
            margin-top: 40px;
            padding: 30px 0;
        }

        footer p {
            margin: 0;
            color: var(--grey-200);
            font-family: var(--primary-font);
            font-size: 0.9rem; 
        }

        section {
            width: 100%;
            display: flex;
        }

        .card-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 40px; 
            padding: 40px; 
            width: 100%;
            box-sizing: border-box; 
        }

        .card {
            width: 100%; 
            max-width: 400px; 
            margin: 0 auto; 
            background-color: var(--white);
            border-radius: 20px;
            overflow: hidden;    
            font-family: var(--primary-font);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card-header {
            display: flex;
            justify-content: center;
        }

        .card-header img {
            width: 100%;
            aspect-ratio: 1 / 1; 
            display: block;
            object-fit: cover;
        }

        .card-footer {
            padding: 15px 0 0 0; 
            text-align: left;
        }

        .card-footer p {
            margin: 0 0 15px 15px; 
            font-weight: none;
            color: var(--grey-800);
        }

        .blue-bar {
            height: 25px;
            background-color: var(--main-color);
            width: 100%;
            transition: 0.3s;
        }

        .card:hover .blue-bar {
            background-color: var(--accent-color);
        }

        .navbar {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            max-width: 95%;
            margin: 0 auto;
            height: 60px;
        }

        .logo h1 {
            color: var(--white);
            font-family: var(--primary-font);
            font-size: 2rem;
            margin: 0;
        }

        .logo span {
            font-size: 1rem;
            vertical-align: middle;
        }

        .search-container form {
            display: flex;
            background-color: var(--white);
            border-radius: 25px;
            overflow: hidden;
            width: 450px; 
        }

        .search-container input {
            border: none;
            padding: 10px 20px;
            flex-grow: 1;
            outline: none;
            font-family: var(--primary-font);
        }

        .search-container button {
            background-color: var(--accent-color); 
            color: var(--white);
            border: none;
            padding: 0 25px;
            cursor: pointer;
            font-family: var(--primary-font);
            transition: 0.3s;
        }

        .search-container button:hover {
            background-color: var(--accent-color);
        }

        .user-icon img {
            height: 45px;
            width: 45px;
            border-radius: 50%;
            background-color: var(--accent-color);
            object-fit: contain;
            padding: 2px; 
            box-sizing: border-box;
        }

    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <h1>ATI<span>[UCV]</span>Log</h1>
            </div>
            
            <div class="search-container">
                <form action="#">
                    <input type="text" placeholder="Nombre..." name="search">
                    <button type="submit">Buscar</button>
                </form>
            </div>

            <div class="user-icon">
                <img src="icon/userIcon.svg" alt="User">
            </div>
        </nav>
    </header>
    <section>
        <div class="card-container">
            <div class="card">
                <div class="card-header">
                    <img src="30371074/30371074.jpg" alt="Dummy1">
                </div>
                <div class="card-footer">
                    <p>Carlos Arena</p>
                <div class="blue-bar"></div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <img src="Dummies/Dummy1.png" alt="Dummy1">
                </div>
                <div class="card-footer">
                    <p>Helena Torres</p>
                <div class="blue-bar"></div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <img src="Dummies/Dummy2.png" alt="Dummy1">
                </div>
                <div class="card-footer">
                    <p>Carlos Blanco</p>
                <div class="blue-bar"></div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <img src="Dummies/Dummy3.png" alt="Dummy1">
                </div>
                <div class="card-footer">
                    <p>Juan Gutierrez</p>
                <div class="blue-bar"></div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <img src="Dummies/Dummy4.png" alt="Dummy1">
                </div>
                <div class="card-footer">
                    <p>Isabel Contreras</p>
                <div class="blue-bar"></div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <img src="Dummies/Dummy5.png" alt="Dummy1">
                </div>
                <div class="card-footer">
                    <p>Gabriel Vargas</p>
                <div class="blue-bar"></div>
                </div>
            </div>
        </div>
    </section>
    <footer>
        <p>Copyright © 2026 Escuela de computación - ATI. Todos los derechos reservados</p>
    </footer>
    
</body>
</html>
